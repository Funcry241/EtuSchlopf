name: Publish Windows r1994 preview
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/windows-r1992-release.yml']
  push:
    branches: [main]
    paths: ['.github/workflows/windows-r1992-release.yml']

permissions: {}

env:
  ARTIFACT_ID: '14827165679'
  ARTIFACT_DIGEST: db564c23a10d7002668dcb7730116b401671dce90635b0c8854eaaac0ca9cad5
  MANIFEST_SHA256: 6be97b01a1f3a3489033a7835bef62294526e1e2a29d28488458ba1a1ee3f657
  SOURCE_COMMIT: 09b4068df1a88b94d45a47f1a2ee84ba4a5562df
  RELEASE_COMMIT: 299afd1e32c8fbc1ecd7f81e2af72c63b1475157
  RELEASE_TAG: v0.10.1839-r1994-windows-preview

jobs:
  verify:
    if: github.repository == 'Funcry241/EtuSchlopf'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify the tested Windows package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/r1994"
          cd "$RUNNER_TEMP/r1994"
          if draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft); then
            if [ "$draft" != false ]; then
              echo "An existing draft requires inspection before publication." >&2
              exit 1
            fi
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern EtuSchlopf-Windows-x64-r1994.exe \
              --pattern EtuSchlopf-Beispiel-r1994.zip \
              --pattern EtuSchlopf-r1994-source.zip \
              --pattern runtime-provenance.txt \
              --pattern SHA256SUMS.txt
          else
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > artifact.zip
            echo "$ARTIFACT_DIGEST  artifact.zip" | sha256sum --check -
            unzip -q artifact.zip
          fi
          echo "$MANIFEST_SHA256  SHA256SUMS.txt" | sha256sum --check -
          sha256sum --strict --check SHA256SUMS.txt
          grep -Fx 'revision=r1994' < <(tr -d '\r' < runtime-provenance.txt)
          grep -Fx "source_commit=$SOURCE_COMMIT" < <(tr -d '\r' < runtime-provenance.txt)
          grep -Fx "workflow=https://github.com/$GITHUB_REPOSITORY/actions/runs/45191408703" < <(tr -d '\r' < runtime-provenance.txt)
          for asset in EtuSchlopf-Windows-x64-r1994.exe EtuSchlopf-Beispiel-r1994.zip EtuSchlopf-r1994-source.zip runtime-provenance.txt SHA256SUMS.txt; do
            test -s "$asset"
          done
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Funcry241/EtuSchlopf' && github.event.before == '299afd1e32c8fbc1ecd7f81e2af72c63b1475157'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Publish the verified Windows preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft > "$RUNNER_TEMP/r1994-release-state"; then
            if grep -Fxq false "$RUNNER_TEMP/r1994-release-state"; then
              echo "Release $RELEASE_TAG is already published."
              exit 0
            fi
            echo "An existing draft requires inspection before publication." >&2
            exit 1
          fi
          mkdir "$RUNNER_TEMP/r1994"
          cd "$RUNNER_TEMP/r1994"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > artifact.zip
          echo "$ARTIFACT_DIGEST  artifact.zip" | sha256sum --check -
          unzip -q artifact.zip
          sha256sum --strict --check SHA256SUMS.txt
          notes="Die portable Windows-x64-EXE enthält EtuSchlopf 0.10.1839 r1994. Der Starttest prüfte die EXE ohne Entwicklerumgebung und renderte das MIDI/WAV-Beispiel bis zum PDF. Die EXE ist unsigniert. Für eigene PDFs brauchst du MuseScore. Die Galerie zeigt die 15 Partituren des abgenommenen Windows-Vollkorpus r1994. [Notenbilder r1994](https://github.com/$GITHUB_REPOSITORY/blob/$RELEASE_COMMIT/docs/examples/README.md#notenbilder) · [Windows-Prüfbeleg r1994](https://github.com/$GITHUB_REPOSITORY/blob/$RELEASE_COMMIT/docs/evidence/r1994/README.md) · [Geprüfter Windows-Build](https://github.com/$GITHUB_REPOSITORY/actions/runs/45191408703)"
          gh release create "$RELEASE_TAG" \
            EtuSchlopf-Windows-x64-r1994.exe EtuSchlopf-Beispiel-r1994.zip EtuSchlopf-r1994-source.zip runtime-provenance.txt SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" --prerelease \
            --title "EtuSchlopf r1994 Windows x64" --notes "$notes"
