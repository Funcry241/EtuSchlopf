name: Windows download
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'ZIP_KIND.txt'
      - 'LICENSE'
      - 'docs/THIRD_PARTY_NOTICES.md'
      - 'docs/licenses/**'
      - 'docs/normative_sources/musicxml/**'
      - 'docs/evidence/r1965/**'
      - 'docs/examples/*-r1965.pdf'
      - 'docs/images/*-r1965-ausschnitt.png'
      - '.gitattributes'
      - '.github/distribution/**'
      - '!.github/distribution/RELEASE.md'
      - '.github/workflows/windows-download.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'ZIP_KIND.txt'
      - 'LICENSE'
      - 'docs/THIRD_PARTY_NOTICES.md'
      - 'docs/licenses/**'
      - 'docs/normative_sources/musicxml/**'
      - 'docs/evidence/r1965/**'
      - 'docs/examples/*-r1965.pdf'
      - 'docs/images/*-r1965-ausschnitt.png'
      - '.gitattributes'
      - '.github/distribution/**'
      - '!.github/distribution/RELEASE.md'
      - '.github/workflows/windows-download.yml'
permissions:
  contents: read
concurrency:
  group: windows-download-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify accepted runtime source
        run: |
          $ErrorActionPreference = 'Stop'
          $acceptance = Get-Content docs/evidence/r1965/native_acceptance.txt
          if ('take_revision=r1965' -notin $acceptance -or
              'accepted_zip_sha256=568cd3fca2fd302c5c66daf797f2c1e8b670a713241f1daee45098917b436386' -notin $acceptance) {
            throw 'Native r1965 acceptance does not match the prepared take'
          }
          if ((Get-FileHash docs/evidence/r1965/native_acceptance.txt -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd02f4d343b6bed36952a052b0d13fae99be4779550d1f3d37877a91638332897') { throw 'Native acceptance record checksum mismatch' }
          python .github/distribution/verify-accepted-source.py --revision r1965 88b090dc2a0b0a9a9eeaad01a803f0346fb834f5c8e99adfd42bcb20be86a493 0519f1c2fbcfd0eef5e9bc6ef8109c97b94abde0f09562799cefb9089ec5b396
          if ($LASTEXITCODE -ne 0) { throw 'Accepted source or documentation verification failed' }
      - name: Build accepted engine
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          $jobs = [Math]::Max(1, [Environment]::ProcessorCount - 1)
          cargo +1.98.0 build --locked --profile strict --bin etuschlopf --jobs $jobs --color never
          if ($LASTEXITCODE -ne 0) { throw 'Accepted engine build failed' }
      - name: Bundle runtime data and licences
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:RUNNER_TEMP 'etuschlopf-runtime'
          New-Item -ItemType Directory -Force "$bundle/docs/normative_sources", "$bundle/docs/licenses", 'dist' | Out-Null
          Copy-Item target/strict/etuschlopf.exe "$bundle/etuschlopf_engine.exe"
          Copy-Item -Recurse docs/normative_sources/musicxml "$bundle/docs/normative_sources/"
          Copy-Item -Recurse docs/licenses/* "$bundle/docs/licenses/"
          Copy-Item docs/THIRD_PARTY_NOTICES.md "$bundle/docs/"
          Copy-Item LICENSE "$bundle/"
          Compress-Archive -Path "$bundle/*" -DestinationPath "$env:RUNNER_TEMP/etuschlopf-runtime.zip"
      - name: Build and test single downloadable EXE
        id: package
        run: |
          $env:ETUSCHLOPF_BUNDLE_ZIP = "$env:RUNNER_TEMP/etuschlopf-runtime.zip"
          cargo +1.98.0 test --locked --manifest-path .github/distribution/Cargo.toml --release
          if ($LASTEXITCODE -ne 0) { throw 'Distribution tests failed' }
          cargo +1.98.0 build --locked --manifest-path .github/distribution/Cargo.toml --release
          if ($LASTEXITCODE -ne 0) { throw 'Distribution build failed' }
          Copy-Item .github/distribution/target/release/etuschlopf_windows_download.exe dist/EtuSchlopf-Windows-x64.exe
      - name: Test packaged EXE without developer PATH
        run: |
          $exe = (Resolve-Path dist/EtuSchlopf-Windows-x64.exe).Path
          $originalPath = $env:PATH
          try {
            $env:PATH = "$env:windir\System32;$env:windir"
            & $exe --version
            if ($LASTEXITCODE -ne 0) { throw 'Standalone version probe failed' }
            & $exe --help
            if ($LASTEXITCODE -ne 0) { throw 'Standalone help probe failed' }
          } finally { $env:PATH = $originalPath }
      - name: Verify isolated runtime and safe rejection
        run: |
          ./.github/distribution/smoke.ps1 -Exe (Resolve-Path dist/EtuSchlopf-Windows-x64.exe).Path
      - name: Render the start example with the packaged EXE
        run: |
          ./.github/distribution/start-example.ps1 -Exe (Resolve-Path dist/EtuSchlopf-Windows-x64.exe).Path -Output dist/EtuSchlopf-Beispiel-r1965.zip
      - name: Package all 14 verified score PDFs
        run: |
          $ErrorActionPreference = 'Stop'
          if ((Get-FileHash docs/evidence/r1965/score_sha256.tsv -Algorithm SHA256).Hash.ToLowerInvariant() -ne '4b1db3076f892fe2e9cc7cc1bc05a244e5f3067ed6ef1a86b33afe59328c5be2') { throw 'Accepted score inventory checksum mismatch' }
          $scoreRows = @(Import-Csv -Delimiter "`t" docs/evidence/r1965/score_sha256.tsv)
          $pdfRows = @($scoreRows | Where-Object { $_.path -like 'docs/examples/*-r1965.pdf' })
          $pngRows = @($scoreRows | Where-Object { $_.path -like 'docs/images/*-r1965-ausschnitt.png' })
          if ($scoreRows.Count -ne 28 -or $pdfRows.Count -ne 14 -or $pngRows.Count -ne 14) { throw 'Expected 14 PDFs and 14 score previews' }
          foreach ($row in $scoreRows) {
            if ((Get-FileHash -LiteralPath $row.path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $row.sha256) { throw "Score file hash mismatch: $($row.path)" }
          }
          $scores = @($scoreRows | ForEach-Object { $_.path })
          git archive --format=zip --output=dist/EtuSchlopf-Notenbilder-r1965.zip $env:GITHUB_SHA -- @scores docs/evidence/r1965/score_credits.md docs/evidence/r1965/score_sha256.tsv
          if ($LASTEXITCODE -ne 0) { throw 'Score archive failed' }
      - name: Hash Windows download
        run: |
          git archive --format=zip --output=dist/EtuSchlopf-r1965-source.zip $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          @("revision=r1965", "commit=$env:GITHUB_SHA", "workflow=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID", "accepted_take_sha256=568cd3fca2fd302c5c66daf797f2c1e8b670a713241f1daee45098917b436386", "source_snapshot_sha256=f26df127c4a4b17e3631e816ef70d4b7a88c207eb2766c465dce650d2b3cb36e") | Set-Content -Encoding ascii dist/runtime-provenance.txt
          $sums = foreach ($name in @('EtuSchlopf-Windows-x64.exe', 'EtuSchlopf-r1965-source.zip', 'EtuSchlopf-Beispiel-r1965.zip', 'EtuSchlopf-Notenbilder-r1965.zip', 'runtime-provenance.txt')) {
            $hash = (Get-FileHash -Algorithm SHA256 "dist/$name").Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $sums | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - name: Keep checked Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: EtuSchlopf-Windows-x64
          path: dist/*
          retention-days: 30
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Publish checked Windows preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v0.10.1839-r1965-windows-preview
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name EtuSchlopf-Windows-x64 --dir dist
          (cd dist && sha256sum --check SHA256SUMS.txt)
          notes="Die portable EXE enthält EtuSchlopf 0.10.1839 r1965. Der native Windows-Vollkorpus umfasst 14 von 14 Werken. Im Notenarchiv findest du alle 14 vollständigen PDFs, je einen Ausschnitt und die Quellenangaben. GitHub prüft die paketierte EXE in einem isolierten Ordner und rendert das mitgelieferte MIDI/WAV-Startbeispiel mit MuseScore. Für die PDF-Ausgabe brauchst du MuseScore. Die EXE ist unsigniert. Die Prüfsummen stehen in SHA256SUMS.txt. [Vollkorpus-Nachweis](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/evidence/r1965/README.md) · [Windows-Build](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          gh release create "$tag" dist/EtuSchlopf-Windows-x64.exe dist/EtuSchlopf-r1965-source.zip dist/EtuSchlopf-Beispiel-r1965.zip dist/EtuSchlopf-Notenbilder-r1965.zip dist/runtime-provenance.txt dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "EtuSchlopf r1965 Windows x64" --notes "$notes"
