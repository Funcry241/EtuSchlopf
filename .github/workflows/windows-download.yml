name: Windows download
on:
  workflow_dispatch:
    inputs:
      sign_release:
        description: Build a SignPath-signed Windows release
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'docs/evidence/r1933/accepted_source_sha256.tsv'
      - 'docs/evidence/r1933/score_sha256.tsv'
      - 'docs/examples/*-r1933.pdf'
      - 'docs/images/*-r1933-ausschnitt.png'
      - '.gitattributes'
      - '.github/distribution/**'
      - '!.github/distribution/RELEASE.md'
      - '.github/workflows/windows-download.yml'
permissions:
  contents: read
concurrency:
  group: windows-download
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check signed release configuration
        if: inputs.sign_release == true
        env:
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Signed releases require main' }
          foreach ($name in @('SIGNPATH_ORGANIZATION_ID', 'SIGNPATH_PROJECT_SLUG', 'SIGNPATH_SIGNING_POLICY_SLUG', 'SIGNPATH_API_TOKEN')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing SignPath configuration: $name"
            }
          }
      - name: Verify accepted runtime source
        run: |
          $ErrorActionPreference = 'Stop'
          $acceptance = Get-Content docs/evidence/r1933/native_acceptance.txt
          if ('take_revision=1933' -notin $acceptance -or
              'accepted_zip_sha256=1bbe6bf3d9cf81bc5e3f23719a52512cac290c82c95b2a898b8ce1d56873de66' -notin $acceptance) {
            throw 'Native r1933 acceptance does not match the prepared take'
          }
          if ((Get-FileHash docs/evidence/r1933/native_acceptance.txt -Algorithm SHA256).Hash.ToLowerInvariant() -ne '61fd5c0482a5c8c12db83d365fd1c745f633f1e7a0f997633e0e1937d94f85e9') { throw 'Native acceptance record checksum mismatch' }
          if ((Get-FileHash docs/evidence/r1933/accepted_source_sha256.tsv -Algorithm SHA256).Hash.ToLowerInvariant() -ne '7b4d29a9c12781a5274a5cf8eaa9a456121295151a99538220d9eb3acdacfa47') { throw 'Accepted source inventory checksum mismatch' }
          if ((Get-FileHash docs/evidence/r1933/github_projection_sha256.tsv -Algorithm SHA256).Hash.ToLowerInvariant() -ne '340bf31a6a021009fba93d98025e12e3ab2fa4d65bc705f932c6ab3ebda41509') { throw 'Public documentation projection checksum mismatch' }
          $projection = @{}
          Get-Content docs/evidence/r1933/github_projection_sha256.tsv | Select-Object -Skip 1 | ForEach-Object {
            $parts = $_ -split "`t"
            $projection[$parts[0]] = $parts[1]
          }
          $sourceCount = 0
          Get-Content docs/evidence/r1933/accepted_source_sha256.tsv | Select-Object -Skip 1 | ForEach-Object {
            $parts = $_ -split "`t"
            $nativePath = $parts[1]
            $expected = $parts[0]
            if ($projection.ContainsKey($nativePath)) { $expected = $projection[$nativePath] }
            if ((Get-FileHash -LiteralPath $nativePath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw "Source differs from accepted r1933 or declared public documentation: $nativePath" }
            $sourceCount++
          }
          if ($sourceCount -ne 2190) { throw 'Accepted source inventory is incomplete' }
          if ($projection.Count -ne 6) { throw 'Unexpected public documentation projection' }
      - name: Build accepted engine
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          $jobs = [Math]::Max(1, [Environment]::ProcessorCount - 1)
          cargo +1.98.0 build --locked --profile strict --bin etuschlopf --jobs $jobs --color never
          if ($LASTEXITCODE -ne 0) { throw 'Accepted engine build failed' }
      - name: Bundle runtime data and licences
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:RUNNER_TEMP 'etuschlopf-runtime'
          New-Item -ItemType Directory -Force "$bundle/docs/normative_sources", "$bundle/docs/licenses", 'dist' | Out-Null
          Copy-Item target/strict/etuschlopf.exe "$bundle/etuschlopf_engine.exe"
          Copy-Item -Recurse docs/normative_sources/musicxml "$bundle/docs/normative_sources/"
          Copy-Item -Recurse docs/licenses/* "$bundle/docs/licenses/"
          Copy-Item docs/THIRD_PARTY_NOTICES.md "$bundle/docs/"
          Copy-Item LICENSE "$bundle/"
          Compress-Archive -Path "$bundle/*" -DestinationPath "$env:RUNNER_TEMP/etuschlopf-runtime.zip"
      - name: Build and test single downloadable EXE
        id: package
        run: |
          $env:ETUSCHLOPF_BUNDLE_ZIP = "$env:RUNNER_TEMP/etuschlopf-runtime.zip"
          cargo +1.98.0 test --locked --manifest-path .github/distribution/Cargo.toml --release
          if ($LASTEXITCODE -ne 0) { throw 'Distribution tests failed' }
          $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $rc = Get-ChildItem -Path "$sdk/*/x64/rc.exe" -File |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (!$rc) { throw 'Windows SDK resource compiler not found' }
          $resource = Join-Path $env:RUNNER_TEMP 'EtuSchlopf-version.res'
          & $rc.FullName /nologo /fo $resource .github/distribution/version.rc
          if ($LASTEXITCODE -ne 0) { throw 'Windows version resource build failed' }
          cargo +1.98.0 rustc --locked --manifest-path .github/distribution/Cargo.toml --release --bin etuschlopf_windows_download -- -C "link-arg=$resource"
          if ($LASTEXITCODE -ne 0) { throw 'Distribution build failed' }
          Copy-Item .github/distribution/target/release/etuschlopf_windows_download.exe dist/EtuSchlopf-Windows-x64.exe
          $version = (Get-Item dist/EtuSchlopf-Windows-x64.exe).VersionInfo
          if ($version.ProductName -ne 'EtuSchlopf' -or $version.ProductVersion -ne '0.10.1839') {
            throw 'Distribution version resource mismatch'
          }
      - name: Upload the executable for signing
        if: inputs.sign_release == true
        id: unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: EtuSchlopf-unsigned
          path: dist/EtuSchlopf-Windows-x64.exe
          retention-days: 1
          if-no-files-found: error
      - name: Request SignPath signature
        if: inputs.sign_release == true
        uses: SignPath/github-action-submit-signing-request@4a84eb4ad763290f059275786f2deed97c2c672b
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: "2700"
          output-artifact-directory: ${{ runner.temp }}/etuschlopf-signed
      - name: Verify Authenticode and use the signed executable
        if: inputs.sign_release == true
        run: |
          $signed = Join-Path $env:RUNNER_TEMP 'etuschlopf-signed/EtuSchlopf-Windows-x64.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $signed
          if ($signature.Status -ne 'Valid' -or !$signature.TimeStamperCertificate) {
            throw 'Expected a valid timestamped Authenticode signature'
          }
          $publisher = $signature.SignerCertificate.GetNameInfo(
            [System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          if ($publisher -ne 'SignPath Foundation') { throw "Unexpected publisher: $publisher" }
          $version = (Get-Item $signed).VersionInfo
          if ($version.ProductName -ne 'EtuSchlopf' -or $version.ProductVersion -ne '0.10.1839') {
            throw 'Signed executable version resource mismatch'
          }
          Copy-Item -LiteralPath $signed -Destination dist/EtuSchlopf-Windows-x64.exe -Force
      - name: Test packaged EXE without developer PATH
        run: |
          $exe = (Resolve-Path dist/EtuSchlopf-Windows-x64.exe).Path
          $originalPath = $env:PATH
          try {
            $env:PATH = "$env:windir\System32;$env:windir"
            & $exe --version
            if ($LASTEXITCODE -ne 0) { throw 'Standalone version probe failed' }
            & $exe --help
            if ($LASTEXITCODE -ne 0) { throw 'Standalone help probe failed' }
          } finally { $env:PATH = $originalPath }
      - name: Verify isolated runtime and safe rejection
        run: |
          ./.github/distribution/smoke.ps1 -Exe (Resolve-Path dist/EtuSchlopf-Windows-x64.exe).Path
      - name: Render the start example with the packaged EXE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./.github/distribution/start-example.ps1 -Exe (Resolve-Path dist/EtuSchlopf-Windows-x64.exe).Path -Output dist/EtuSchlopf-Beispiel-r1933.zip
      - name: Package all 14 verified score PDFs
        run: |
          $ErrorActionPreference = 'Stop'
          $scoreRows = @(Import-Csv -Delimiter "`t" docs/evidence/r1933/score_sha256.tsv)
          $pdfRows = @($scoreRows | Where-Object { $_.path -like 'docs/examples/*-r1933.pdf' })
          $pngRows = @($scoreRows | Where-Object { $_.path -like 'docs/images/*-r1933-ausschnitt.png' })
          if ($scoreRows.Count -ne 28 -or $pdfRows.Count -ne 14 -or $pngRows.Count -ne 14) { throw 'Expected 14 PDFs and 14 score previews' }
          foreach ($row in $scoreRows) {
            if ((Get-FileHash -LiteralPath $row.path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $row.sha256) { throw "Score PDF hash mismatch: $($row.path)" }
          }
          $scores = @($scoreRows | ForEach-Object { $_.path })
          git archive --format=zip --output=dist/EtuSchlopf-Notenbilder-r1933.zip $env:GITHUB_SHA -- @scores docs/evidence/r1933/score_credits.md docs/evidence/r1933/score_sha256.tsv
          if ($LASTEXITCODE -ne 0) { throw 'Score archive failed' }
      - name: Hash Windows download
        run: |
          git archive --format=zip --output=dist/EtuSchlopf-r1933-source.zip $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          @("revision=r1933", "commit=$env:GITHUB_SHA", "workflow=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID", "accepted_take_sha256=1bbe6bf3d9cf81bc5e3f23719a52512cac290c82c95b2a898b8ce1d56873de66") | Set-Content -Encoding ascii dist/runtime-provenance.txt
          $sums = foreach ($name in @('EtuSchlopf-Windows-x64.exe', 'EtuSchlopf-r1933-source.zip', 'EtuSchlopf-Beispiel-r1933.zip', 'EtuSchlopf-Notenbilder-r1933.zip', 'runtime-provenance.txt')) {
            $hash = (Get-FileHash -Algorithm SHA256 "dist/$name").Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $sums | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - name: Keep checked Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: EtuSchlopf-Windows-x64
          path: dist/*
          retention-days: 30
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Publish checked Windows preview
        env:
          GH_TOKEN: ${{ github.token }}
          SIGN_RELEASE: ${{ inputs.sign_release == true }}
        run: |
          set -euo pipefail
          tag=v0.10.1839-r1933-windows-preview
          signature_note="The EXE is unsigned."
          if [[ "$SIGN_RELEASE" == true ]]; then
            tag=v0.10.1839-r1933-windows-signed-preview
            signature_note="Free code signing provided by SignPath.io, certificate by SignPath Foundation."
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name EtuSchlopf-Windows-x64 --dir dist
          (cd dist && sha256sum --check SHA256SUMS.txt)
          notes="Windows x64 test version from natively accepted revision r1933 (0.10.1839). Native Windows acceptance: all 14 corpus pieces produced PDFs and the manifest self-check passed. The score archive includes the PDFs, preview images and attribution. Windows checks: isolated start without developer PATH, unchanged input hashes, distribution tests and a freshly rendered synthetic MIDI/WAV example. MuseScore is required for PDFs. $signature_note Package checks and source commit: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh release create "$tag" dist/EtuSchlopf-Windows-x64.exe dist/EtuSchlopf-r1933-source.zip dist/EtuSchlopf-Beispiel-r1933.zip dist/EtuSchlopf-Notenbilder-r1933.zip dist/runtime-provenance.txt dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "EtuSchlopf r1933 Windows x64" --notes "$notes"
