name: Windows download
on:
  workflow_dispatch:
  push:
    branches: [main, windows-report-fix]
    paths:
      - '.gitattributes'
      - '.github/distribution/**'
      - '.github/workflows/windows-download.yml'
permissions:
  contents: read
concurrency:
  group: windows-download
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_STRICT_BUILD_OVERRIDE_OPT_LEVEL: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify pinned candidate runtime source
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Content docs/evidence/r1530/candidate_runtime_sha256.tsv | Select-Object -Skip 1 | ForEach-Object {
            $parts = $_ -split "`t"
            if ((Get-FileHash -Algorithm SHA256 $parts[0]).Hash.ToLowerInvariant() -ne $parts[1]) { throw "Runtime differs from r1530 preview: $($parts[0])" }
          }
      - name: Build candidate engine
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          $jobs = [Math]::Max(1, [Environment]::ProcessorCount - 1)
          cargo +1.98.0 build --locked --profile strict --bin etuschlopf --jobs $jobs --color never
          if ($LASTEXITCODE -ne 0) { throw 'Candidate engine build failed' }
      - name: Run strict regression suite including explicit no-PDF outcome
        run: |
          $jobs = [Math]::Max(1, [Environment]::ProcessorCount - 1)
          cargo +1.98.0 test --locked --profile strict --all-targets --config 'profile.strict.package.etuschlopf.opt-level=0' --jobs $jobs --color never
          if ($LASTEXITCODE -ne 0) { throw 'Strict regression tests failed' }
      - name: Strict Clippy
        run: |
          $jobs = [Math]::Max(1, [Environment]::ProcessorCount - 1)
          cargo +1.98.0 clippy --locked --profile strict --jobs $jobs --color never -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Strict Clippy failed' }
      - name: Bundle runtime data and licences
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:RUNNER_TEMP 'etuschlopf-runtime'
          New-Item -ItemType Directory -Force "$bundle/docs/normative_sources", "$bundle/docs/licenses", 'dist' | Out-Null
          Copy-Item target/strict/etuschlopf.exe "$bundle/etuschlopf_engine.exe"
          Copy-Item -Recurse docs/normative_sources/musicxml "$bundle/docs/normative_sources/"
          Copy-Item -Recurse docs/licenses/* "$bundle/docs/licenses/"
          Copy-Item docs/THIRD_PARTY_NOTICES.md "$bundle/docs/"
          Copy-Item LICENSE "$bundle/"
          Compress-Archive -Path "$bundle/*" -DestinationPath "$env:RUNNER_TEMP/etuschlopf-runtime.zip"
      - name: Build and test single downloadable EXE
        id: package
        run: |
          $env:ETUSCHLOPF_BUNDLE_ZIP = "$env:RUNNER_TEMP/etuschlopf-runtime.zip"
          cargo +1.98.0 test --locked --manifest-path .github/distribution/Cargo.toml --release
          if ($LASTEXITCODE -ne 0) { throw 'Distribution tests failed' }
          cargo +1.98.0 build --locked --manifest-path .github/distribution/Cargo.toml --release
          if ($LASTEXITCODE -ne 0) { throw 'Distribution build failed' }
          Copy-Item .github/distribution/target/release/etuschlopf_windows_download.exe dist/EtuSchlopf-Windows-x64.exe
      - name: Test packaged EXE without developer PATH
        run: |
          $exe = (Resolve-Path dist/EtuSchlopf-Windows-x64.exe).Path
          $originalPath = $env:PATH
          try {
            $env:PATH = "$env:windir\System32;$env:windir"
            & $exe --version
            if ($LASTEXITCODE -ne 0) { throw 'Standalone version probe failed' }
            & $exe --help
            if ($LASTEXITCODE -ne 0) { throw 'Standalone help probe failed' }
          } finally { $env:PATH = $originalPath }
      - name: Real audible package tests without MuseScore
        run: |
          $exe = (Resolve-Path dist/EtuSchlopf-Windows-x64.exe).Path
          foreach ($case in @('synthetic','menuet')) {
            ./.github/distribution/package-check.ps1 -Exe $exe -Renderer Missing -Case $case
            if ($LASTEXITCODE -ne 0) { throw "Missing-renderer package test failed: $case" }
          }
      - name: Install pinned official MuseScore for PDF tests
        id: renderer_install
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: ./.github/distribution/install-ci-musescore.ps1
      - name: Real audible package tests with MuseScore
        if: ${{ !cancelled() && steps.package.outcome == 'success' && steps.renderer_install.outcome == 'success' }}
        run: |
          $exe = (Resolve-Path dist/EtuSchlopf-Windows-x64.exe).Path
          foreach ($case in @('synthetic','menuet')) {
            ./.github/distribution/package-check.ps1 -Exe $exe -Renderer Present -Case $case
            if ($LASTEXITCODE -ne 0) { throw "Real MuseScore PDF package test failed: $case" }
          }
      - name: Hash Windows download
        if: ${{ success() }}
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 dist/EtuSchlopf-Windows-x64.exe).Hash.ToLowerInvariant()
          "$hash  EtuSchlopf-Windows-x64.exe" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - name: Keep package diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-diagnostics
          path: ${{ runner.temp }}/etuschlopf-real-package-*/**
          retention-days: 14
          if-no-files-found: warn
      - name: Keep Windows build for review
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: EtuSchlopf-Windows-x64
          path: dist/*
          retention-days: 30
          if-no-files-found: error

