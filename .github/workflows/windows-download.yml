name: Windows download
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'ZIP_KIND.txt'
      - 'LICENSE'
      - 'docs/THIRD_PARTY_NOTICES.md'
      - 'docs/licenses/**'
      - 'docs/normative_sources/musicxml/**'
      - 'docs/evidence/r2005/**'
      - '.gitattributes'
      - '.github/distribution/**'
      - '!.github/distribution/RELEASE.md'
      - '.github/workflows/windows-download.yml'
permissions:
  contents: read
concurrency:
  group: windows-download-${{ github.ref }}
  cancel-in-progress: false
env:
  RELEASE_TAG: v0.10.1839-r2005-windows-preview
jobs:
  # A push to main only needs the ten-minute Windows build while the preview
  # release is still missing. Manual runs always build.
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Check whether the Windows preview is already published
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ] && gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. The push run skips the Windows build." | tee -a "$GITHUB_STEP_SUMMARY"
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: release-check
    if: needs.release-check.outputs.build == 'true'
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: public
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
      CARGO_INCREMENTAL: '0'
      ETU_BUILD_ROOT: D:\etu-r2005-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: public
          persist-credentials: false
      - name: Verify and reconstruct the accepted r2005 source
        run: |
          python .github/distribution/prepare-r2005-source.py . $env:ETU_BUILD_ROOT "$env:RUNNER_TEMP/etuschlopf-source"
          if ($LASTEXITCODE -ne 0) { throw 'Native r2005 source preparation failed' }
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
      # The engine comes only from the checksum-verified r2005 inventory, so its
      # binary is keyed on that inventory, the preparation script and the toolchain.
      - name: Restore accepted engine from cache
        id: engine-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: D:\etu-r2005-build\target\strict\etuschlopf.exe
          key: etu-r2005-engine-v1-${{ runner.os }}-${{ runner.arch }}-rust1.98.0-strict-crtstatic-${{ hashFiles('public/docs/evidence/r2005/accepted-source.tsv', 'public/docs/evidence/r2005/native-documents.zip', 'public/.github/distribution/prepare-r2005-source.py') }}
      - name: Build accepted engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        working-directory: D:\etu-r2005-build
        run: |
          $jobs = [Environment]::ProcessorCount
          cargo +1.98.0 build --locked --profile strict --bin etuschlopf --jobs $jobs --color never
          if ($LASTEXITCODE -ne 0) { throw 'Accepted engine build failed' }
      - name: Save accepted engine for later runs
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: D:\etu-r2005-build\target\strict\etuschlopf.exe
          key: ${{ steps.engine-cache.outputs.cache-primary-key }}
      - name: Bundle runtime data and licences
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:RUNNER_TEMP 'etuschlopf-runtime'
          New-Item -ItemType Directory -Force "$bundle/docs/normative_sources", "$bundle/docs/licenses", 'dist' | Out-Null
          Copy-Item "$env:RUNNER_TEMP/etuschlopf-source/*.zip" dist/
          Copy-Item "$env:ETU_BUILD_ROOT/target/strict/etuschlopf.exe" "$bundle/etuschlopf_engine.exe"
          Copy-Item -Recurse "$env:ETU_BUILD_ROOT/docs/normative_sources/musicxml" "$bundle/docs/normative_sources/"
          Copy-Item -Recurse docs/licenses/* "$bundle/docs/licenses/"
          Copy-Item docs/THIRD_PARTY_NOTICES.md "$bundle/docs/"
          Copy-Item LICENSE "$bundle/"
          Compress-Archive -Path "$bundle/*" -DestinationPath "$env:RUNNER_TEMP/etuschlopf-runtime.zip"
      - name: Build and test single downloadable EXE
        id: package
        run: |
          $env:ETUSCHLOPF_BUNDLE_ZIP = "$env:RUNNER_TEMP/etuschlopf-runtime.zip"
          cargo +1.98.0 test --locked --manifest-path .github/distribution/Cargo.toml --release
          if ($LASTEXITCODE -ne 0) { throw 'Distribution tests failed' }
          cargo +1.98.0 build --locked --manifest-path .github/distribution/Cargo.toml --release
          if ($LASTEXITCODE -ne 0) { throw 'Distribution build failed' }
          Copy-Item .github/distribution/target/release/etuschlopf_windows_download.exe dist/EtuSchlopf-Windows-x64-r2005.exe
      - name: Test packaged EXE without developer PATH
        run: |
          $exe = (Resolve-Path dist/EtuSchlopf-Windows-x64-r2005.exe).Path
          $originalPath = $env:PATH
          try {
            $env:PATH = "$env:windir\System32;$env:windir"
            $version = & $exe --version
            if ($LASTEXITCODE -ne 0 -or "$version" -notmatch '\b0\.10\.1839\b') { throw "Standalone version probe failed: $version" }
            Write-Output $version
            & $exe --help
            if ($LASTEXITCODE -ne 0) { throw 'Standalone help probe failed' }
          } finally { $env:PATH = $originalPath }
      - name: Verify isolated runtime and safe rejection
        run: |
          ./.github/distribution/smoke.ps1 -Exe (Resolve-Path dist/EtuSchlopf-Windows-x64-r2005.exe).Path
      - name: Render the start example with the packaged EXE
        run: |
          ./.github/distribution/start-example.ps1 -Exe (Resolve-Path dist/EtuSchlopf-Windows-x64-r2005.exe).Path -Output dist/EtuSchlopf-Beispiel-r2005.zip
      - name: Hash Windows downloads
        env:
          ENGINE_CACHE_HIT: ${{ steps.engine-cache.outputs.cache-hit == 'true' }}
        run: |
          @("revision=r2005", "public_commit=$env:GITHUB_SHA", "workflow=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID", "accepted_take_sha256=135bd9cd4a51874732ecca8d7056afe54d3579f202b373393e476ad765437e7f", "native_snapshot_sha256=1d0e73a8943573af71f26d7168143f33a19627bee7a7a310a8b71f098cdf53d2", "engine_cache_hit=$env:ENGINE_CACHE_HIT") | Set-Content -Encoding ascii dist/runtime-provenance.txt
          $sums = foreach ($name in @('EtuSchlopf-Windows-x64-r2005.exe', 'EtuSchlopf-r2005-source.zip', 'EtuSchlopf-Beispiel-r2005.zip', 'runtime-provenance.txt')) {
            $hash = (Get-FileHash -Algorithm SHA256 "dist/$name").Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $sums | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - name: Keep checked Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: EtuSchlopf-Windows-x64
          path: public/dist/*
          retention-days: 30
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Publish checked Windows preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name EtuSchlopf-Windows-x64 --dir dist
          (cd dist && sha256sum --check SHA256SUMS.txt)
          notes="Die portable EXE enthält EtuSchlopf 0.10.1839 r2005. Der Windows-Vollkorpus setzte alle 15 Stücke. Kurze Basspausen erhalten bei eindeutig bestimmbarer Zielhöhe eine bessere grafische Position. Im Vergleich mit r2002 änderten sich zwölf Pausenpositionen in drei Partituren. Bei 144 dpi sind 55 von 59 PDF-Seiten pixelgleich. Das Startbeispiel enthält MIDI, WAV und das frisch gerenderte PDF. Das Quellarchiv enthält die geprüfte Cargo.lock. Für die PDF-Ausgabe brauchst du MuseScore. Die EXE ist unsigniert. [Windows-Abnahme r2005]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/evidence/r2005/README.md) · [Windows-Build]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          gh release create "$tag" dist/EtuSchlopf-Windows-x64-r2005.exe dist/EtuSchlopf-r2005-source.zip dist/EtuSchlopf-Beispiel-r2005.zip dist/runtime-provenance.txt dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "EtuSchlopf r2005 Windows x64" --notes "$notes"
