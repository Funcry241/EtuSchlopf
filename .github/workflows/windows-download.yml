name: Windows download
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'ZIP_KIND.txt'
      - 'LICENSE'
      - 'docs/THIRD_PARTY_NOTICES.md'
      - 'docs/licenses/**'
      - 'docs/normative_sources/musicxml/**'
      - 'README.md'
      - 'docs/README.md'
      - 'docs/MATHEMATIK*.md'
      - 'docs/CONTRIBUTING.md'
      - 'docs/community/issue_templates/01_fehler.md'
      - 'docs/evidence/r1968/**'
      - '.gitattributes'
      - '.github/distribution/**'
      - '!.github/distribution/RELEASE.md'
      - '.github/workflows/windows-download.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'ZIP_KIND.txt'
      - 'LICENSE'
      - 'docs/THIRD_PARTY_NOTICES.md'
      - 'docs/licenses/**'
      - 'docs/normative_sources/musicxml/**'
      - 'README.md'
      - 'docs/README.md'
      - 'docs/MATHEMATIK*.md'
      - 'docs/CONTRIBUTING.md'
      - 'docs/community/issue_templates/01_fehler.md'
      - 'docs/evidence/r1968/**'
      - '.gitattributes'
      - '.github/distribution/**'
      - '!.github/distribution/RELEASE.md'
      - '.github/workflows/windows-download.yml'
permissions:
  contents: read
concurrency:
  group: windows-download-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: public
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
      CARGO_INCREMENTAL: '0'
      ETU_NATIVE_ROOT: D:\etu-r1968-review-input
      ETU_BUILD_ROOT: D:\etu-r1968-build
      TAKE_NAME: EtuSchlopf_v0_10_1839_r1968_Reduktion_unbuilt_source.zip
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: public
          persist-credentials: false
      - name: Check out the successful native Windows review
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 5cb89ebe0a977d104f92535ed7778624cae07a41
          path: review
          persist-credentials: false
      - name: Reproduce the accepted Take ZIP
        working-directory: review
        run: |
          python .github/strict-ci/verify.py prepare
          if ($LASTEXITCODE -ne 0) { throw 'Could not reproduce the accepted r1968 Take' }
      - name: Verify public sources against the exact native build
        run: |
          python .github/distribution/prepare-r1968-source.py $env:ETU_NATIVE_ROOT $env:ETU_BUILD_ROOT "$env:RUNNER_TEMP/etuschlopf-source"
          if ($LASTEXITCODE -ne 0) { throw 'Native r1968 source preparation failed' }
          python .github/distribution/verify-accepted-source.py --revision r1968 --accepted-root $env:ETU_BUILD_ROOT 233a6a86fb77ac85e08004d858654267ea2bd151918e5f53cef28a0fdbbdea0b f78592f5ff094d778874fa66cdf6573811e44528f303dace48ab0cbf40ab0a88
          if ($LASTEXITCODE -ne 0) { throw 'Public or accepted native source verification failed' }
      - name: Build accepted engine
        working-directory: D:\etu-r1968-build
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          $jobs = [Math]::Max(1, [Environment]::ProcessorCount - 1)
          cargo +1.98.0 build --locked --profile strict --bin etuschlopf --jobs $jobs --color never
          if ($LASTEXITCODE -ne 0) { throw 'Accepted engine build failed' }
      - name: Bundle runtime data and licences
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:RUNNER_TEMP 'etuschlopf-runtime'
          New-Item -ItemType Directory -Force "$bundle/docs/normative_sources", "$bundle/docs/licenses", 'dist' | Out-Null
          Copy-Item "$env:RUNNER_TEMP/etuschlopf-source/*.zip" dist/
          Copy-Item "$env:ETU_BUILD_ROOT/target/strict/etuschlopf.exe" "$bundle/etuschlopf_engine.exe"
          Copy-Item -Recurse "$env:ETU_BUILD_ROOT/docs/normative_sources/musicxml" "$bundle/docs/normative_sources/"
          Copy-Item -Recurse docs/licenses/* "$bundle/docs/licenses/"
          Copy-Item docs/THIRD_PARTY_NOTICES.md "$bundle/docs/"
          Copy-Item LICENSE "$bundle/"
          Compress-Archive -Path "$bundle/*" -DestinationPath "$env:RUNNER_TEMP/etuschlopf-runtime.zip"
      - name: Build and test single downloadable EXE
        id: package
        run: |
          $env:ETUSCHLOPF_BUNDLE_ZIP = "$env:RUNNER_TEMP/etuschlopf-runtime.zip"
          cargo +1.98.0 test --locked --manifest-path .github/distribution/Cargo.toml --release
          if ($LASTEXITCODE -ne 0) { throw 'Distribution tests failed' }
          cargo +1.98.0 build --locked --manifest-path .github/distribution/Cargo.toml --release
          if ($LASTEXITCODE -ne 0) { throw 'Distribution build failed' }
          Copy-Item .github/distribution/target/release/etuschlopf_windows_download.exe dist/EtuSchlopf-Windows-x64.exe
      - name: Test packaged EXE without developer PATH
        run: |
          $exe = (Resolve-Path dist/EtuSchlopf-Windows-x64.exe).Path
          $originalPath = $env:PATH
          try {
            $env:PATH = "$env:windir\System32;$env:windir"
            $version = & $exe --version
            if ($LASTEXITCODE -ne 0 -or "$version" -notmatch '\b0\.10\.1839\b') { throw "Standalone version probe failed: $version" }
            Write-Output $version
            & $exe --help
            if ($LASTEXITCODE -ne 0) { throw 'Standalone help probe failed' }
          } finally { $env:PATH = $originalPath }
      - name: Verify isolated runtime and safe rejection
        run: |
          ./.github/distribution/smoke.ps1 -Exe (Resolve-Path dist/EtuSchlopf-Windows-x64.exe).Path
      - name: Render the start example with the packaged EXE
        run: |
          ./.github/distribution/start-example.ps1 -Exe (Resolve-Path dist/EtuSchlopf-Windows-x64.exe).Path -Output dist/EtuSchlopf-Beispiel-r1968.zip
      - name: Hash Windows downloads
        run: |
          @("revision=r1968", "public_commit=$env:GITHUB_SHA", "workflow=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID", "native_review_commit=5cb89ebe0a977d104f92535ed7778624cae07a41", "native_review_run=44831896224", "accepted_take_sha256=2138a8f2ad1746367c443f5c7ac80dada47b48f04414f2f21a773bf4f7a11880", "native_tree_sha256=233a6a86fb77ac85e08004d858654267ea2bd151918e5f53cef28a0fdbbdea0b") | Set-Content -Encoding ascii dist/runtime-provenance.txt
          $sums = foreach ($name in @('EtuSchlopf-Windows-x64.exe', 'EtuSchlopf-r1968-source.zip', $env:TAKE_NAME, 'EtuSchlopf-Beispiel-r1968.zip', 'runtime-provenance.txt')) {
            $hash = (Get-FileHash -Algorithm SHA256 "dist/$name").Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $sums | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - name: Keep checked Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: EtuSchlopf-Windows-x64
          path: public/dist/*
          retention-days: 30
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Publish checked Windows preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v0.10.1839-r1968-windows-preview
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name EtuSchlopf-Windows-x64 --dir dist
          (cd dist && sha256sum --check SHA256SUMS.txt)
          notes="Die portable EXE enthält die nativ unter Windows angenommene Engine 0.10.1839 r1968. Der Windows-Vollkorpus r1968 setzte alle 14 Stücke. Alle 28 MusicXML-Dateien stimmen bytegenau und alle 57 PDF-Seiten bei 144 dpi pixelgenau mit r1965 überein. Das Startbeispiel enthält MIDI, WAV und die mit dieser EXE frisch gerenderte PDF. Zum Bauen enthält EtuSchlopf-r1968-source.zip die geprüfte Cargo.lock. Das zweite Quell-ZIP ist der angenommene Take für das Update von r1967 auf r1968. Für die PDF-Ausgabe brauchst du MuseScore. Die EXE ist unsigniert. [Abnahme r1968]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/evidence/r1968/README.md) · [Veröffentlichte Korpusnoten aus r1965]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v0.10.1839-r1965-windows-preview) · [Windows-Build]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          gh release create "$tag" dist/EtuSchlopf-Windows-x64.exe dist/EtuSchlopf-r1968-source.zip dist/EtuSchlopf_v0_10_1839_r1968_Reduktion_unbuilt_source.zip dist/EtuSchlopf-Beispiel-r1968.zip dist/runtime-provenance.txt dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "EtuSchlopf r1968 Windows x64" --notes "$notes"
