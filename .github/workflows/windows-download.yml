name: Windows r1965 CI preview
on:
  workflow_dispatch:
  push:
    branches: [take/r1965-performance]
permissions:
  contents: read
concurrency:
  group: windows-preview-r1965
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/take/r1965-performance'
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_STRICT_BUILD_OVERRIDE_OPT_LEVEL: '1'
      CI_BASE_SHA: d34aadbe42fd058e2daf7a35eb8d788018433a06
      CI_SOURCE_SHA: 629ce771343fe2eca0fb47535d7c3b323fb35708
      CI_SOURCE_DIFF_SHA256: 1657f0881c03fca3d1e32fcd0729b6712ce5508f34833bc565d6c11a945f870e
      CI_TAKE_SHA256: 568cd3fca2fd302c5c66daf797f2c1e8b670a713241f1daee45098917b436386
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Verify r1964 baseline and exact r1965 build inputs
        run: |
          @'
          import hashlib, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args])
          base, source = os.environ['CI_BASE_SHA'], os.environ['CI_SOURCE_SHA']
          if git('rev-parse', source + '^').decode().strip() != base or git('rev-parse', 'HEAD^').decode().strip() != source:
              raise SystemExit('Unexpected commit parents')
          subprocess.run(['git', 'diff', '--exit-code', source, 'HEAD', '--', '.', ':(exclude).github/workflows/windows-download.yml'], check=True)
          stage = pathlib.Path(os.environ['RUNNER_TEMP']) / 'etuschlopf-accepted-base'
          git('worktree', 'add', '--detach', str(stage), base)
          receipt = (stage / 'docs/evidence/r1964/native_acceptance.txt').read_bytes()
          if hashlib.sha256(receipt).hexdigest() != '7d30cb7d598f98d7f151caacc982c29f7db343b4494407a59946dff6d955935e':
              raise SystemExit('Unexpected r1964 acceptance record')
          subprocess.run(['python', '.github/distribution/verify-accepted-source.py', '467f51863e55d9a2b6cfb11fd98a9cd7c6fe60c897f5adf56d67339522b6f15c', 'bff697d9233856fa337ae7311004a2b861cb56ece5e425e860f4988545c39c5b'], cwd=stage, check=True)
          delta = hashlib.sha256()
          names = sorted(p.decode('utf-8') for p in git('diff', '--name-only', '-z', base, source).split(b'\0') if p)
          for name in names:
              digest = hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
              delta.update(f'{digest}\t{name}\n'.encode('utf-8'))
          if delta.hexdigest() != os.environ['CI_SOURCE_DIFF_SHA256']:
              raise SystemExit('Changed files differ from the tested r1965 take')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Source verification failed' }
      - name: Test engine on Windows with Rust 1.98
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          cargo +1.98.0 clippy --locked --profile strict --jobs 2 --color never -- -D clippy::correctness -D clippy::suspicious -D clippy::perf
          if ($LASTEXITCODE -ne 0) { throw 'Strict Clippy failed' }
          cargo +1.98.0 test --locked --profile strict --all-targets --jobs 2 --color never
          if ($LASTEXITCODE -ne 0) { throw 'Native engine tests failed' }
          cargo +1.98.0 build --locked --profile strict --bin etuschlopf --jobs 2 --color never
          if ($LASTEXITCODE -ne 0) { throw 'Native engine build failed' }
      - name: Bundle runtime data and licences
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:RUNNER_TEMP 'etuschlopf-runtime'
          New-Item -ItemType Directory -Force "$bundle/docs/normative_sources", "$bundle/docs/licenses", 'dist' | Out-Null
          Copy-Item target/strict/etuschlopf.exe "$bundle/etuschlopf_engine.exe"
          Copy-Item -Recurse docs/normative_sources/musicxml "$bundle/docs/normative_sources/"
          Copy-Item -Recurse docs/licenses/* "$bundle/docs/licenses/"
          Copy-Item docs/THIRD_PARTY_NOTICES.md "$bundle/docs/"
          Copy-Item LICENSE "$bundle/"
          Compress-Archive -Path "$bundle/*" -DestinationPath "$env:RUNNER_TEMP/etuschlopf-runtime.zip"
      - name: Build and test single downloadable EXE
        run: |
          $env:ETUSCHLOPF_BUNDLE_ZIP = "$env:RUNNER_TEMP/etuschlopf-runtime.zip"
          cargo +1.98.0 test --locked --manifest-path .github/distribution/Cargo.toml --release
          if ($LASTEXITCODE -ne 0) { throw 'Distribution tests failed' }
          cargo +1.98.0 build --locked --manifest-path .github/distribution/Cargo.toml --release
          if ($LASTEXITCODE -ne 0) { throw 'Distribution build failed' }
          Copy-Item .github/distribution/target/release/etuschlopf_windows_download.exe dist/EtuSchlopf-Windows-x64.exe
      - name: Test packaged EXE without developer PATH
        run: |
          $exe = (Resolve-Path dist/EtuSchlopf-Windows-x64.exe).Path
          $originalPath = $env:PATH
          try {
            $env:PATH = "$env:windir\System32;$env:windir"
            & $exe --version
            if ($LASTEXITCODE -ne 0) { throw 'Standalone version probe failed' }
            & $exe --help
            if ($LASTEXITCODE -ne 0) { throw 'Standalone help probe failed' }
          } finally { $env:PATH = $originalPath }
      - name: Verify isolated runtime and safe rejection
        run: |
          ./.github/distribution/smoke.ps1 -Exe (Resolve-Path dist/EtuSchlopf-Windows-x64.exe).Path
      - name: Render the start example with the packaged EXE
        run: |
          ./.github/distribution/start-example.ps1 -Exe (Resolve-Path dist/EtuSchlopf-Windows-x64.exe).Path -Output dist/EtuSchlopf-Beispiel-r1965-CI.zip
      - name: Record CI build provenance and SHA-256
        run: |
          @("revision=r1965", "status=ci_preview", "base_commit=$env:CI_BASE_SHA", "source_commit=$env:CI_SOURCE_SHA", "workflow_commit=$env:GITHUB_SHA", "source_diff_sha256=$env:CI_SOURCE_DIFF_SHA256", "input_take_sha256=$env:CI_TAKE_SHA256", "workflow=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID") | Set-Content -Encoding ascii dist/runtime-provenance.txt
          $sums = foreach ($name in @('EtuSchlopf-Windows-x64.exe', 'EtuSchlopf-Beispiel-r1965-CI.zip', 'runtime-provenance.txt')) {
            $hash = (Get-FileHash -Algorithm SHA256 "dist/$name").Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $sums | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - name: Upload tested Windows CI preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: EtuSchlopf-r1965-Windows-x64-CI
          path: dist/*
          retention-days: 30
          if-no-files-found: error
