name: Windows download
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'docs/evidence/r1961/**'
      - 'docs/examples/*-r1961.pdf'
      - 'docs/images/*-r1961-ausschnitt.png'
      - '.gitattributes'
      - '.github/distribution/**'
      - '!.github/distribution/RELEASE.md'
      - '.github/workflows/windows-download.yml'
  push:
    branches: [main]
    paths:
      - 'docs/evidence/r1961/**'
      - 'docs/examples/*-r1961.pdf'
      - 'docs/images/*-r1961-ausschnitt.png'
      - '.gitattributes'
      - '.github/distribution/**'
      - '!.github/distribution/RELEASE.md'
      - '.github/workflows/windows-download.yml'
permissions:
  contents: read
concurrency:
  group: windows-download-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify accepted runtime source
        run: |
          $ErrorActionPreference = 'Stop'
          $acceptance = Get-Content docs/evidence/r1961/native_acceptance.txt
          if ('take_revision=1961' -notin $acceptance -or
              'accepted_zip_sha256=fbe94e63f1d72b96de698069047e8649fbe7990dda5e38a0fc762c5946fbd691' -notin $acceptance) {
            throw 'Native r1961 acceptance does not match the prepared take'
          }
          if ((Get-FileHash docs/evidence/r1961/native_acceptance.txt -Algorithm SHA256).Hash.ToLowerInvariant() -ne '51fdd3970c480e257f659040f7ae9d641eab388ac7c8d8ed94f479cb6bc3d4cc') { throw 'Native acceptance record checksum mismatch' }
          if ((Get-FileHash docs/evidence/r1961/accepted_source_sha256.tsv -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'cb5f50ffb09285b764f08416d32bf529e283dea83d7a57219d393b13c7c3dc33') { throw 'Accepted source inventory checksum mismatch' }
          if ((Get-FileHash docs/evidence/r1961/github_projection_sha256.tsv -Algorithm SHA256).Hash.ToLowerInvariant() -ne '4cb2d412251d13655ff52b5db32949754d904280f92310f474257dcfb987e55f') { throw 'Public documentation projection checksum mismatch' }
          $projection = @{}
          Get-Content docs/evidence/r1961/github_projection_sha256.tsv | Select-Object -Skip 1 | ForEach-Object {
            $parts = $_ -split "`t"
            $projection[$parts[0]] = $parts[1]
          }
          $sourceCount = 0
          Get-Content docs/evidence/r1961/accepted_source_sha256.tsv | Select-Object -Skip 1 | ForEach-Object {
            $parts = $_ -split "`t"
            $nativePath = $parts[1]
            $expected = $parts[0]
            if ($projection.ContainsKey($nativePath)) { $expected = $projection[$nativePath] }
            if ((Get-FileHash -LiteralPath $nativePath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw "Source differs from accepted r1961 or declared public documentation: $nativePath" }
            $sourceCount++
          }
          if ($sourceCount -ne 2213) { throw 'Accepted source inventory is incomplete' }
          if ($projection.Count -ne 5) { throw 'Unexpected public documentation projection' }
      - name: Build accepted engine
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          $jobs = [Math]::Max(1, [Environment]::ProcessorCount - 1)
          cargo +1.98.0 build --locked --profile strict --bin etuschlopf --jobs $jobs --color never
          if ($LASTEXITCODE -ne 0) { throw 'Accepted engine build failed' }
      - name: Bundle runtime data and licences
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:RUNNER_TEMP 'etuschlopf-runtime'
          New-Item -ItemType Directory -Force "$bundle/docs/normative_sources", "$bundle/docs/licenses", 'dist' | Out-Null
          Copy-Item target/strict/etuschlopf.exe "$bundle/etuschlopf_engine.exe"
          Copy-Item -Recurse docs/normative_sources/musicxml "$bundle/docs/normative_sources/"
          Copy-Item -Recurse docs/licenses/* "$bundle/docs/licenses/"
          Copy-Item docs/THIRD_PARTY_NOTICES.md "$bundle/docs/"
          Copy-Item LICENSE "$bundle/"
          Compress-Archive -Path "$bundle/*" -DestinationPath "$env:RUNNER_TEMP/etuschlopf-runtime.zip"
      - name: Build and test single downloadable EXE
        id: package
        run: |
          $env:ETUSCHLOPF_BUNDLE_ZIP = "$env:RUNNER_TEMP/etuschlopf-runtime.zip"
          cargo +1.98.0 test --locked --manifest-path .github/distribution/Cargo.toml --release
          if ($LASTEXITCODE -ne 0) { throw 'Distribution tests failed' }
          cargo +1.98.0 build --locked --manifest-path .github/distribution/Cargo.toml --release
          if ($LASTEXITCODE -ne 0) { throw 'Distribution build failed' }
          Copy-Item .github/distribution/target/release/etuschlopf_windows_download.exe dist/EtuSchlopf-Windows-x64.exe
      - name: Test packaged EXE without developer PATH
        run: |
          $exe = (Resolve-Path dist/EtuSchlopf-Windows-x64.exe).Path
          $originalPath = $env:PATH
          try {
            $env:PATH = "$env:windir\System32;$env:windir"
            & $exe --version
            if ($LASTEXITCODE -ne 0) { throw 'Standalone version probe failed' }
            & $exe --help
            if ($LASTEXITCODE -ne 0) { throw 'Standalone help probe failed' }
          } finally { $env:PATH = $originalPath }
      - name: Verify isolated runtime and safe rejection
        run: |
          ./.github/distribution/smoke.ps1 -Exe (Resolve-Path dist/EtuSchlopf-Windows-x64.exe).Path
      - name: Render the start example with the packaged EXE
        run: |
          ./.github/distribution/start-example.ps1 -Exe (Resolve-Path dist/EtuSchlopf-Windows-x64.exe).Path -Output dist/EtuSchlopf-Beispiel-r1961.zip
      - name: Package all 14 verified score PDFs
        run: |
          $ErrorActionPreference = 'Stop'
          if ((Get-FileHash docs/evidence/r1961/score_sha256.tsv -Algorithm SHA256).Hash.ToLowerInvariant() -ne '0403b9a6e6ca4a42f7ca2d204a0160d35c771cba994180bedfa0871808c3fd22') { throw 'Accepted score inventory checksum mismatch' }
          $scoreRows = @(Import-Csv -Delimiter "`t" docs/evidence/r1961/score_sha256.tsv)
          $pdfRows = @($scoreRows | Where-Object { $_.path -like 'docs/examples/*-r1961.pdf' })
          $pngRows = @($scoreRows | Where-Object { $_.path -like 'docs/images/*-r1961-ausschnitt.png' })
          if ($scoreRows.Count -ne 28 -or $pdfRows.Count -ne 14 -or $pngRows.Count -ne 14) { throw 'Expected 14 PDFs and 14 score previews' }
          foreach ($row in $scoreRows) {
            if ((Get-FileHash -LiteralPath $row.path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $row.sha256) { throw "Score PDF hash mismatch: $($row.path)" }
          }
          $scores = @($scoreRows | ForEach-Object { $_.path })
          git archive --format=zip --output=dist/EtuSchlopf-Notenbilder-r1961.zip $env:GITHUB_SHA -- @scores docs/evidence/r1961/score_credits.md docs/evidence/r1961/score_sha256.tsv
          if ($LASTEXITCODE -ne 0) { throw 'Score archive failed' }
      - name: Hash Windows download
        run: |
          git archive --format=zip --output=dist/EtuSchlopf-r1961-source.zip $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          @("revision=r1961", "commit=$env:GITHUB_SHA", "workflow=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID", "accepted_take_sha256=fbe94e63f1d72b96de698069047e8649fbe7990dda5e38a0fc762c5946fbd691") | Set-Content -Encoding ascii dist/runtime-provenance.txt
          $sums = foreach ($name in @('EtuSchlopf-Windows-x64.exe', 'EtuSchlopf-r1961-source.zip', 'EtuSchlopf-Beispiel-r1961.zip', 'EtuSchlopf-Notenbilder-r1961.zip', 'runtime-provenance.txt')) {
            $hash = (Get-FileHash -Algorithm SHA256 "dist/$name").Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $sums | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - name: Keep checked Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: EtuSchlopf-Windows-x64
          path: dist/*
          retention-days: 30
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Publish checked Windows preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v0.10.1839-r1961-windows-preview
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name EtuSchlopf-Windows-x64 --dir dist
          (cd dist && sha256sum --check SHA256SUMS.txt)
          notes="Windows x64 test version from natively accepted revision r1961 (0.10.1839). Native Windows acceptance: all 14 corpus pieces produced PDFs and the manifest self-check passed. The score archive includes the PDFs, preview images and attribution. Windows checks: isolated start without developer PATH, unchanged input hashes, distribution tests and a freshly rendered synthetic MIDI/WAV example. MuseScore is required for PDFs; the EXE is unsigned. Package checks and source commit: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh release create "$tag" dist/EtuSchlopf-Windows-x64.exe dist/EtuSchlopf-r1961-source.zip dist/EtuSchlopf-Beispiel-r1961.zip dist/EtuSchlopf-Notenbilder-r1961.zip dist/runtime-provenance.txt dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "EtuSchlopf r1961 Windows x64" --notes "$notes"
