name: MuseScore installer preflight
on:
  push:
    branches: [release/r1537-windows-preview]
    paths: ['.github/workflows/musescore-preflight.yml']
concurrency:
  group: musescore-preflight
  cancel-in-progress: true
permissions:
  contents: read
  actions: write
jobs:
  install:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    env:
      QT_COMMAND_LINE_PARSER_NO_GUI_MESSAGE_BOXES: '1'
      QT_QPA_PLATFORM: windows
    steps:
      - name: Stop the superseded renderer probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $url = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/40679871648"
          $previous = Invoke-RestMethod -Uri $url -Headers $headers
          if ($previous.status -in @('queued','in_progress','waiting')) { Invoke-RestMethod -Method Post -Uri "$url/cancel" -Headers $headers | Out-Null }
      - name: Install the pinned MuseScore renderer
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'MuseScore-Studio-4.7.4.260706075-x86_64.msi'
          $base = 'https://github.com/musescore/MuseScore/releases/download/v4.7.4'
          Invoke-WebRequest "$base/$name" -OutFile "$env:RUNNER_TEMP/$name"
          Invoke-WebRequest "$base/checksums.sha256.txt" -OutFile "$env:RUNNER_TEMP/musescore-checksums.txt"
          $row = Get-Content "$env:RUNNER_TEMP/musescore-checksums.txt" | Where-Object { $_ -like "*$name" } | Select-Object -First 1
          if (-not $row) { throw 'Official renderer checksum missing' }
          $expected = ($row -split '\s+')[0].ToLowerInvariant()
          if ((Get-FileHash "$env:RUNNER_TEMP/$name" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'MuseScore download checksum mismatch' }
          $installerPath = (Resolve-Path (Join-Path $env:RUNNER_TEMP $name)).Path
          $installerLog = Join-Path $env:RUNNER_TEMP 'musescore-install.log'
          $installerExe = Join-Path $env:windir 'System32\msiexec.exe'
          $install = Start-Process $installerExe -ArgumentList "/i `"$installerPath`" /qn /norestart /L*v `"$installerLog`"" -Wait -PassThru
          if ($install.ExitCode -notin @(0,3010)) {
            if (Test-Path $installerLog) { Get-Content $installerLog | Select-Object -Last 80 }
            throw "MuseScore installer exit $($install.ExitCode)"
          }
          $renderer = Get-ChildItem "$env:ProgramFiles/MuseScore*" -Recurse -Filter MuseScore4.exe | Select-Object -First 1
          if (-not $renderer) { throw 'Installed renderer executable not found' }
          "ETUSCHLOPF_PDF_RENDERER=$($renderer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Check the installed renderer
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'renderer-version.stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'renderer-version.stderr.txt'
          $process = Start-Process -FilePath $env:ETUSCHLOPF_PDF_RENDERER -ArgumentList '--long-version' -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(30000)) {
            taskkill.exe /PID $process.Id /T /F | Out-Null
            Get-Content $stdout
            Get-Content $stderr
            throw 'Renderer parent process did not exit within 30 seconds'
          }
          $process.WaitForExit()
          Get-Content $stdout
          Get-Content $stderr
          Write-Output "Renderer exit: $($process.ExitCode)"
          if ($process.ExitCode -ne 0) { throw 'Installed renderer version check failed' }
          if ((Get-Content $stdout -Raw) -notmatch '4\.7\.4') { throw 'Expected renderer version was not observed' }
      - name: Probe actual PDF conversion with bounded process lifetimes
        run: |
          $input = Join-Path $env:RUNNER_TEMP 'renderer-probe.musicxml'
          $xml = '<?xml version="1.0" encoding="UTF-8"?><score-partwise version="4.0"><part-list><score-part id="P1"><part-name>Piano</part-name></score-part></part-list><part id="P1"><measure number="1"><attributes><divisions>1</divisions><key><fifths>0</fifths></key><time><beats>4</beats><beat-type>4</beat-type></time><clef><sign>G</sign><line>2</line></clef></attributes><note><pitch><step>C</step><octave>4</octave></pitch><duration>4</duration><type>whole</type></note></measure></part></score-partwise>'
          [IO.File]::WriteAllText($input,$xml,[Text.UTF8Encoding]::new($false))
          $success = $false
          for ($attempt=0; $attempt -lt 2; $attempt++) {
            $pdf = Join-Path $env:RUNNER_TEMP "renderer-probe-$attempt.pdf"
            $out = Join-Path $env:RUNNER_TEMP "renderer-probe-$attempt.stdout.txt"
            $err = Join-Path $env:RUNNER_TEMP "renderer-probe-$attempt.stderr.txt"
            $info = [Diagnostics.ProcessStartInfo]::new()
            $info.FileName = $env:ETUSCHLOPF_PDF_RENDERER
            $info.UseShellExecute = $false
            $info.RedirectStandardOutput = $true
            $info.RedirectStandardError = $true
            if ($attempt -eq 1) { $info.ArgumentList.Add('-s'); $info.ArgumentList.Add('-w') }
            $info.ArgumentList.Add('-o'); $info.ArgumentList.Add($pdf); $info.ArgumentList.Add($input)
            $process = [Diagnostics.Process]::new(); $process.StartInfo = $info
            $process.Start() | Out-Null
            $stdoutTask = $process.StandardOutput.ReadToEndAsync()
            $stderrTask = $process.StandardError.ReadToEndAsync()
            $finished = $process.WaitForExit(30000)
            if (-not $finished) {
              $process.Refresh()
              Write-Output "Renderer probe $attempt timed out; CPU $($process.TotalProcessorTime.TotalSeconds) s; window $($process.MainWindowTitle)"
              $process.Kill($true); $process.WaitForExit()
            }
            $stdout = $stdoutTask.GetAwaiter().GetResult(); $stderr = $stderrTask.GetAwaiter().GetResult()
            [IO.File]::WriteAllText($out,$stdout); [IO.File]::WriteAllText($err,$stderr)
            Write-Output "Renderer probe $attempt exited $($process.ExitCode); finished within limit: $finished"
            Write-Output $stdout; Write-Output $stderr
            if ($finished -and $process.ExitCode -eq 0 -and (Test-Path $pdf) -and (Get-Item $pdf).Length -gt 100) { $success=$true; break }
          }
          if (-not $success) { throw 'Neither ordinary nor audio/web-disabled PDF conversion completed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: MuseScore-installer-preflight-log
          path: |
            ${{ runner.temp }}/musescore-install.log
            ${{ runner.temp }}/renderer-probe*
          retention-days: 7
          if-no-files-found: ignore
