name: Windows r1994 artifact
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/windows-r1994-artifact.yml'
      - '.github/distribution/prepare-r1994-source.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: public
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
      CARGO_INCREMENTAL: '0'
      ETU_BUILD_ROOT: D:\etu-r1994-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: public
          persist-credentials: false
      - name: Check out the accepted r1994 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 299afd1e32c8fbc1ecd7f81e2af72c63b1475157
          path: accepted
          persist-credentials: false
      - name: Verify and reconstruct the accepted r1994 source
        run: python .github/distribution/prepare-r1994-source.py ../accepted $env:ETU_BUILD_ROOT "$env:RUNNER_TEMP/etuschlopf-r1994-source"
      - name: Build accepted engine
        working-directory: D:\etu-r1994-build
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          $jobs = [Environment]::ProcessorCount
          cargo +1.98.0 build --locked --profile strict --bin etuschlopf --jobs $jobs --color never
      - name: Bundle runtime data and licences
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'etuschlopf-r1994-runtime'
          New-Item -ItemType Directory -Force "$bundle/docs/normative_sources", "$bundle/docs/licenses", 'dist' | Out-Null
          Copy-Item "$env:RUNNER_TEMP/etuschlopf-r1994-source/*.zip" dist/
          Copy-Item "$env:ETU_BUILD_ROOT/target/strict/etuschlopf.exe" "$bundle/etuschlopf_engine.exe"
          Copy-Item -Recurse "$env:ETU_BUILD_ROOT/docs/normative_sources/musicxml" "$bundle/docs/normative_sources/"
          Copy-Item -Recurse "$env:ETU_BUILD_ROOT/docs/licenses/*" "$bundle/docs/licenses/"
          Copy-Item "$env:ETU_BUILD_ROOT/docs/THIRD_PARTY_NOTICES.md" "$bundle/docs/"
          Copy-Item LICENSE "$bundle/"
          Compress-Archive -Path "$bundle/*" -DestinationPath "$env:RUNNER_TEMP/etuschlopf-r1994-runtime.zip"
      - name: Build and test the standalone EXE
        run: |
          $env:ETUSCHLOPF_BUNDLE_ZIP = "$env:RUNNER_TEMP/etuschlopf-r1994-runtime.zip"
          cargo +1.98.0 test --locked --manifest-path .github/distribution/Cargo.toml --release
          if ($LASTEXITCODE -ne 0) { throw 'Distribution tests failed' }
          cargo +1.98.0 build --locked --manifest-path .github/distribution/Cargo.toml --release
          if ($LASTEXITCODE -ne 0) { throw 'Distribution build failed' }
          Copy-Item .github/distribution/target/release/etuschlopf_windows_download.exe dist/EtuSchlopf-Windows-x64-r1994.exe
      - name: Test packaged EXE without developer PATH
        run: |
          $exe = (Resolve-Path dist/EtuSchlopf-Windows-x64-r1994.exe).Path
          $originalPath = $env:PATH
          try {
            $env:PATH = "$env:windir\System32;$env:windir"
            $version = & $exe --version
            if ($LASTEXITCODE -ne 0 -or "$version" -notmatch '\b0\.10\.1839\b') { throw "Standalone version probe failed: $version" }
            Write-Output $version
            & $exe --help
            if ($LASTEXITCODE -ne 0) { throw 'Standalone help probe failed' }
          } finally { $env:PATH = $originalPath }
      - name: Verify isolated runtime and safe rejection
        run: ./.github/distribution/smoke.ps1 -Exe (Resolve-Path dist/EtuSchlopf-Windows-x64-r1994.exe).Path
      - name: Render the start example with the packaged EXE
        run: ./.github/distribution/start-example.ps1 -Exe (Resolve-Path dist/EtuSchlopf-Windows-x64-r1994.exe).Path -Output dist/EtuSchlopf-Beispiel-r1994.zip
      - name: Record source and artifact checksums
        run: |
          $sourceCommit = git -C ../accepted rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Accepted source commit unavailable' }
          @(
            'revision=r1994'
            "source_commit=$sourceCommit"
            "workflow_commit=$env:GITHUB_SHA"
            "workflow=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            'native_snapshot_sha256=6c6ba408002f1cb6ad777bbf6b3803900936c16abe82e2bae173022e1055e10d'
            'native_inventory_sha256=85fe93c6ba9b1e3d4053a270327bfc9607ceaf9cd907ec28903d673ce074cc42'
          ) | Set-Content -Encoding ascii dist/runtime-provenance.txt
          $sums = foreach ($name in @('EtuSchlopf-Windows-x64-r1994.exe', 'EtuSchlopf-r1994-source.zip', 'EtuSchlopf-Beispiel-r1994.zip', 'runtime-provenance.txt')) {
            $hash = (Get-FileHash -Algorithm SHA256 "dist/$name").Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $sums | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - name: Keep checked Windows artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: EtuSchlopf-Windows-x64-r1994
          path: public/dist/*
          retention-days: 30
          if-no-files-found: error
