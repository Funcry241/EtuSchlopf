[package]
name = "etuschlopf"
version = "0.10.1839"
edition = "2024"
rust-version = "1.88"
resolver = "3"
build = "src/kodex_build_orchestrator.rs"
description = "FLP/WAV-Projektpipeline: Klavier-PDF aus Projektname"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
roxmltree = "0.20"
schemaschlopf = { path = "tools/qualified_components/schemaschlopf_r021", version = "=0.1.0", default-features = false }
serde = { version = "1", features = ["derive"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }


[profile.strict]
inherits = "release"
overflow-checks = true

[lints.rust]
warnings = "warn"
